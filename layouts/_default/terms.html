<!DOCTYPE html>
<html lang="{{ .Site.Language.LanguageCode | default "en" }}">
{{ partial "head.html" . }}
<body><a class="skip-link" href="#main">Skip to content</a><div class="portfolio inner-page">
  {{ partial "header.html" . }}
  <main id="main"><a class="back-link" href="{{ .Site.Home.RelPermalink }}">← Back to home</a><h1 class="page-title">{{ .Title }}</h1><div class="post-tags">{{ range .Data.Terms.Alphabetical }}<a href="{{ .Page.RelPermalink }}">#{{ .Page.Title }} <span>{{ .Count }}</span></a>{{ end }}</div></main>
  {{ partial "footer.html" . }}
</div></body></html>
