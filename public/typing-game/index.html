eight:2.2rem;color:#928374;position:relative;max-height:120px;overflow:hidden;margin-bottom:20px;outline:none;cursor:text;user-select:none}#typing-game:focus{box-shadow:0 0 0 2px #fabd2f}#words-container{display:flex;flex-wrap:wrap;gap:8px 12px;position:relative;top:0;transition:top .2s ease}.word{display:flex}.letter{position:relative}.letter.correct{color:#b8bb26}.letter.incorrect{color:#fb4934}.letter.active{color:#ebdbb2}.letter.active::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);height:1.2em;width:3px;background-color:#fabd2f;animation:blink 1s infinite}.letter.active-space::after{content:'';position:absolute;right:-6px;top:50%;transform:translateY(-50%);height:1.2em;width:3px;background-color:#fabd2f;animation:blink 1s infinite}@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}#stats{display:flex;align-items:center;gap:20px;font-size:1.2rem;color:#ebdbb2;margin-bottom:20px;font-weight:700}.stat-box{background:#3c3836;padding:10px 15px;border-radius:5px}#restart-btn{background:#fabd2f;color:#282828;border:none;padding:10px 15px;border-radius:5px;cursor:pointer;font-weight:700;font-size:1rem;transition:background .2s}#restart-btn:hover{background:#d79921}#hidden-input{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;border:none}</style><div id=stats><div class=stat-box>Time: <span id=time>30</span>s</div><div class=stat-box>WPM: <span id=wpm>0</span></div><button id=restart-btn>Restart Game</button></div><div id=typing-game><input type=text id=hidden-input autocomplete=off autocorrect=off autocapitalize=off spellcheck=false dir=ltr><div id=words-container></div></div><script>const wordList=["the","of","to","and","a","in","is","it","you","that","he","was","for","on","are","with","as","I","his","they","be","at","one","have","this","from","or","had","by","not","word","but","what","some","we","can","out","other","were","all","there","when","up","use","your","how","said","an","each","she","which","do","their","time","if","will","way","about","many","then","them","write","would","like","so","these","her","long","make","thing","see","him","two","has","look","more","day","could","go","come","did","number","sound","no","most","people","my","over","know","water","than","call","first","who","may","down","side","been","now","find","any"];let words=[],currentWordIndex=0,currentLetterIndex=0,timer=30,timeInterval=null,isPlaying=!1,correctKeystrokes=0;const wordsContainer=document.getElementById("words-container"),timeEl=document.getElementById("time"),wpmEl=document.getElementById("wpm"),gameContainer=document.getElementById("typing-game"),restartBtn=document.getElementById("restart-btn"),hiddenInput=document.getElementById("hidden-input");function initGame(){words=[],currentWordIndex=0,currentLetterIndex=0,timer=30,isPlaying=!1,correctKeystrokes=0,timeEl.innerText=timer,wpmEl.innerText=0,clearInterval(timeInterval),wordsContainer.innerHTML="",wordsContainer.style.top="0px";let e=[];for(let t=0;t<100;t++)e.push(wordList[Math.floor(Math.random()*wordList.length)]);e.forEach(e=>{const t=document.createElement("div");t.className="word";for(let s of e){const n=document.createElement("span");n.className="letter",n.innerText=s,t.appendChild(n)}wordsContainer.appendChild(t),words.push({el:t,text:e})}),updateActiveLetter()}function startGame(){isPlaying||(isPlaying=!0,timeInterval=setInterval(()=>{timer--,timeEl.innerText=timer,timer<=0&&endGame()},1e3))}function endGame(){clearInterval(timeInterval),isPlaying=!1;const e=Math.round(correctKeystrokes/5/(30/60));wpmEl.innerText=e,wordsContainer.innerHTML=`<div style="color:#b8bb26; font-size: 1.8rem; text-align:center; width: 100%; margin-top: 30px;">Time's up! Your WPM: ${e}</div>`}function updateActiveLetter(){if(document.querySelectorAll(".letter").forEach(e=>{e.classList.remove("active"),e.classList.remove("active-space")}),currentWordIndex<words.length){const e=words[currentWordIndex];if(currentLetterIndex<e.text.length)e.el.children[currentLetterIndex].classList.add("active");else{const t=e.el.children[e.text.length-1];t.classList.add("active-space")}const t=e.el.offsetTop;t>60&&(wordsContainer.style.top=`-${t}px`)}}hiddenInput.addEventListener("keydown",e=>{if(timer<=0||!words[currentWordIndex])return;if(e.ctrlKey||e.altKey||e.metaKey)return;if(e.key.length===1||e.key==="Backspace"){e.preventDefault(),startGame();const t=words[currentWordIndex],n=t.el.children;if(e.key==="Backspace"){if(currentLetterIndex>0)currentLetterIndex--,n[currentLetterIndex].classList.remove("correct","incorrect");else if(currentWordIndex>0){currentWordIndex--;const e=words[currentWordIndex];currentLetterIndex=e.text.length}}else e.key===" "?currentLetterIndex>0&&(currentWordIndex++,currentLetterIndex=0):currentLetterIndex<t.text.length&&(e.key===t.text[currentLetterIndex]?(n[currentLetterIndex].classList.add("correct"),correctKeystrokes++):n[currentLetterIndex].classList.add("incorrect"),currentLetterIndex++);updateActiveLetter()}}),hiddenInput.addEventListener("input",()=>{hiddenInput.value=""}),gameContainer.addEventListener("click",()=>hiddenInput.focus()),restartBtn.addEventListener("click",()=>{initGame(),hiddenInput.focus()}),initGame(),hiddenInput.focus(),document.addEventListener("keydown",e=>{document.activeElement!==hiddenInput&&!e.ctrlKey&&!e.metaKey&&!e.altKey&&(e.key.length===1||e.key==="Backspace")&&hiddenInput.focus()})</script></article></main><footer class=site-footer><span>© 2026 Atul Prathap</span><nav aria-label=Footer><a href=/Portfolio-website/posts/>Writing</a>
